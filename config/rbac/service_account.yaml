---
# The operator's own identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assay-controller-manager
  namespace: assay-system
  labels:
    app.kubernetes.io/name: assay-model-scanner
    app.kubernetes.io/component: controller
---
# Scan pods run as a separate, far less privileged identity. They process
# untrusted model bytes, so they may only write their own scan reports.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assay-scanner
  namespace: assay-system
  labels:
    app.kubernetes.io/name: assay-model-scanner
    app.kubernetes.io/component: scanner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assay-scanner-role
  namespace: assay-system
rules:
  # The publish step creates and updates the report for its own scan. It
  # deliberately has no access to Secrets, Pods, or any other scan's data.
  - apiGroups: ["security.davano.io"]
    resources: ["artifactscanreports"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assay-scanner-rolebinding
  namespace: assay-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: assay-scanner-role
subjects:
  - kind: ServiceAccount
    name: assay-scanner
    namespace: assay-system
