---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: complianceprofiles.security.zeus.io
spec:
  group: security.zeus.io
  names:
    kind: ComplianceProfile
    listKind: ComplianceProfileList
    plural: complianceprofiles
    shortNames:
    - cprof
    singular: complianceprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.framework
      name: Framework
      type: string
    - jsonPath: .status.attestedControls
      name: Attested
      type: integer
    - jsonPath: .status.expiredAttestations
      name: Expired
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ComplianceProfile declares a governance framework and its attestations.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ComplianceProfileSpec declares a governance framework to report against and
              carries the organizational attestations Zeus cannot produce itself.
            properties:
              attestations:
                description: Attestations close controls that have no technical evidence
                  path.
                items:
                  description: |-
                    ControlAttestation records a human statement closing a control that no
                    scanner can observe — that staff are trained, that leadership accepted a
                    risk, that a diverse team reviewed a decision.
                  properties:
                    attestedAt:
                      description: AttestedAt is when the statement was made.
                      format: date-time
                      type: string
                    attestedBy:
                      description: |-
                        AttestedBy names the accountable person or team. An unattributed
                        attestation is not an attestation, so this is required.
                      minLength: 1
                      type: string
                    controlID:
                      description: ControlID is the framework subcategory, e.g. "GOVERN
                        2.2".
                      type: string
                    evidenceURI:
                      description: |-
                        EvidenceURI points at supporting documentation — a policy document, a
                        training record, a signed approval.
                      type: string
                    expiresAt:
                      description: |-
                        ExpiresAt bounds the attestation. Omitting it is accepted but reported
                        as a warning: an attestation that never expires is never re-examined.
                      format: date-time
                      type: string
                    statement:
                      description: Statement is what is being attested.
                      minLength: 1
                      type: string
                  required:
                  - attestedBy
                  - controlID
                  - statement
                  type: object
                type: array
              blockOnOpenControls:
                description: |-
                  BlockOnOpenControls makes the admission gate refuse deployment while
                  any control remains open. Off by default: framework conformance is a
                  governance posture, and wiring it to admission on day one would block
                  every model in the cluster.
                type: boolean
              exclusions:
                description: Exclusions scope controls out, each with a justification.
                items:
                  description: ControlExclusion scopes a control out of a profile.
                  properties:
                    controlID:
                      description: ControlID to exclude.
                      type: string
                    justification:
                      description: |-
                        Justification for the exclusion. Required — an unexplained exclusion
                        is indistinguishable from an oversight, so Zeus rejects it.
                      minLength: 1
                      type: string
                  required:
                  - controlID
                  - justification
                  type: object
                type: array
              framework:
                default: nist-ai-rmf-1.0
                description: Framework to assess against.
                enum:
                - nist-ai-rmf-1.0
                type: string
              modelSelector:
                description: |-
                  ModelSelector limits the profile to models whose name matches one of
                  these globs. Empty applies it to every model in the namespace.
                items:
                  type: string
                type: array
            required:
            - framework
            type: object
          status:
            description: ComplianceProfileStatus reports profile-level validity.
            properties:
              attestedControls:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              excludedControls:
                format: int32
                type: integer
              expiredAttestations:
                description: |-
                  ExpiredAttestations counts attestations past their expiry, which stop
                  closing their control.
                format: int32
                type: integer
              message:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
