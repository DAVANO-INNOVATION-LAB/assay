---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: modelsecurityreports.security.zeus.io
spec:
  group: security.zeus.io
  names:
    kind: ModelSecurityReport
    listKind: ModelSecurityReportList
    plural: modelsecurityreports
    shortNames:
    - msr
    singular: modelsecurityreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .spec.modelVersion
      name: Version
      type: string
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .status.riskScore
      name: Risk
      type: integer
    - jsonPath: .status.malware
      name: Malware
      type: string
    - jsonPath: .status.lastScanTime
      name: Last Scan
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelSecurityReport is the consolidated security posture of a
          model version.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSecurityReportSpec identifies the model version this
              report covers.
            properties:
              artifact:
                description: ArtifactRef identifies a model artifact and where it
                  lives.
                properties:
                  digest:
                    description: Digest is the content digest of the artifact, when
                      known.
                    type: string
                  format:
                    description: |-
                      Format is the model format reported by the registry
                      (e.g. safetensors, onnx, pickle, gguf).
                    type: string
                  mediaType:
                    description: MediaType of the artifact, when known.
                    type: string
                  sizeBytes:
                    description: SizeBytes is the artifact size, when known.
                    format: int64
                    type: integer
                  uri:
                    description: |-
                      URI of the artifact. Supported schemes: s3://bucket/path,
                      oci://registry/repo:tag, pvc://claim-name/path,
                      modelcar://registry/repo@sha256:..., https://...
                    type: string
                required:
                - uri
                type: object
              modelName:
                type: string
              modelVersion:
                type: string
              scanRef:
                description: ScanRef names the ArtifactScan that produced this report.
                type: string
            required:
            - modelName
            - modelVersion
            type: object
          status:
            description: |-
              ModelSecurityReportStatus is the consolidated security posture of a
              model version. The admission webhook reads this to gate deployments.
            properties:
              approvedEnvironments:
                description: |-
                  ApprovedEnvironments lists environments this version is promoted to
                  (dev, stage, prod), managed via PromotionRequests.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cves:
                description: SeverityCounts summarizes findings by severity.
                properties:
                  critical:
                    format: int32
                    type: integer
                  high:
                    format: int32
                    type: integer
                  low:
                    format: int32
                    type: integer
                  medium:
                    format: int32
                    type: integer
                  unknown:
                    format: int32
                    type: integer
                type: object
              lastScanTime:
                format: date-time
                type: string
              malware:
                enum:
                - Clean
                - Detected
                - Unknown
                type: string
              riskScore:
                description: RiskScore is 0 (clean) to 100 (critical risk).
                format: int32
                type: integer
              sbomRef:
                description: SBOMRef names the ArtifactScanReport containing the SBOM.
                type: string
              scanners:
                items:
                  description: ScannerResult is the per-scanner outcome of a scan.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    findings:
                      description: Findings is the total number of findings the scanner
                        reported.
                      format: int32
                      type: integer
                    message:
                      type: string
                    reportRef:
                      description: ReportRef names the ArtifactScanReport holding
                        detailed findings.
                      type: string
                    scanner:
                      description: Scanner is the scanner name (e.g. clamav, trivy,
                        model-inspector).
                      type: string
                    severities:
                      description: SeverityCounts summarizes findings by severity.
                      properties:
                        critical:
                          format: int32
                          type: integer
                        high:
                          format: int32
                          type: integer
                        low:
                          format: int32
                          type: integer
                        medium:
                          format: int32
                          type: integer
                        unknown:
                          format: int32
                          type: integer
                      type: object
                    status:
                      enum:
                      - Pending
                      - Running
                      - Passed
                      - Failed
                      - Error
                      - Skipped
                      type: string
                  required:
                  - scanner
                  - status
                  type: object
                type: array
              secrets:
                enum:
                - Clean
                - Detected
                - Unknown
                type: string
              signatureVerified:
                type: boolean
              verdict:
                enum:
                - Approved
                - Quarantined
                - ReviewRequired
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
