---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: promotionrequests.security.davano.io
spec:
  group: security.davano.io
  names:
    kind: PromotionRequest
    listKind: PromotionRequestList
    plural: promotionrequests
    singular: promotionrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .spec.modelVersion
      name: Version
      type: string
    - jsonPath: .spec.targetEnvironment
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PromotionRequest asks to promote a model version to an environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PromotionRequestSpec asks to promote a model version to an environment.

              Requestor, DecidedBy and DecidedAt are stamped by the admission webhook from
              the authenticated request and whatever a submitter puts in them is discarded.
              That is the same rule ArtifactException follows and for the same reason: a
              name in a payload is a claim, and an approval nobody can attribute is not an
              approval.
            properties:
              decidedAt:
                description: DecidedAt is stamped when Decision is first set.
                format: date-time
                type: string
              decidedBy:
                description: DecidedBy is stamped from the authenticated identity
                  that set Decision.
                type: string
              decidedByGroups:
                description: DecidedByGroups records the groups that identity belonged
                  to.
                items:
                  type: string
                type: array
              decision:
                description: |-
                  Decision is the human step. Empty means nobody has decided yet, which is
                  the state a promotion request exists to hold: the controller can say
                  whether a promotion is *permissible*, and only a person can say whether
                  it should happen.
                enum:
                - Approve
                - Reject
                type: string
              decisionReason:
                description: |-
                  DecisionReason explains the decision. Required to reject, because an
                  unexplained refusal is indistinguishable from an oversight later.
                type: string
              justification:
                type: string
              modelName:
                type: string
              modelVersion:
                type: string
              requestor:
                description: |-
                  Requestor is stamped from the authenticated identity that created the
                  request.
                type: string
              targetEnvironment:
                enum:
                - dev
                - stage
                - prod
                type: string
            required:
            - modelName
            - modelVersion
            - targetEnvironment
            type: object
          status:
            description: PromotionRequestStatus tracks the approval workflow.
            properties:
              message:
                type: string
              observedVerdictTime:
                description: |-
                  ObservedVerdictTime is when that verdict was issued. An approval signed
                  against one verdict must not silently carry over to a later one.
                format: date-time
                type: string
              phase:
                description: |-
                  Phase is where the request has got to.

                  Blocked is distinct from Rejected on purpose: one means a person said no,
                  the other means the model's own security verdict forbids the promotion
                  regardless of what anybody says. Collapsing them would make a policy
                  refusal look like a human decision.
                enum:
                - Pending
                - Approved
                - Rejected
                - Blocked
                type: string
              reviewTime:
                format: date-time
                type: string
              reviewedBy:
                type: string
              verdict:
                description: |-
                  Verdict is the security verdict this request was last evaluated against,
                  so a reviewer sees what they are approving rather than having to go and
                  look it up.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
