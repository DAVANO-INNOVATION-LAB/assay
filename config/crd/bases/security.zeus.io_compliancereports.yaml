---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: compliancereports.security.zeus.io
spec:
  group: security.zeus.io
  names:
    kind: ComplianceReport
    listKind: ComplianceReportList
    plural: compliancereports
    shortNames:
    - crep
    singular: compliancereport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .spec.modelVersion
      name: Version
      type: string
    - jsonPath: .spec.framework
      name: Framework
      type: string
    - jsonPath: .status.conformant
      name: Conformant
      type: boolean
    - jsonPath: .status.openControlCount
      name: Open
      type: integer
    - jsonPath: .status.assessedAt
      name: Assessed
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ComplianceReport is a model version assessed against a governance
          framework.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComplianceReportSpec identifies what was assessed.
            properties:
              framework:
                description: Framework assessed against.
                type: string
              modelName:
                type: string
              modelVersion:
                type: string
              profileRef:
                description: ProfileRef names the ComplianceProfile used.
                type: string
              reportRef:
                description: ReportRef names the ModelSecurityReport the evidence
                  came from.
                type: string
            required:
            - framework
            - modelName
            - modelVersion
            type: object
          status:
            description: ComplianceReportStatus is the assessment outcome.
            properties:
              assessedAt:
                format: date-time
                type: string
              attestationOnly:
                format: int32
                type: integer
              automatableFull:
                description: |-
                  Automatable records how much of the framework any scanner could
                  evidence, independent of this particular model. It is reported so the
                  conformance numbers are read in context rather than as a claim that
                  Zeus assessed the whole framework.
                format: int32
                type: integer
              automatablePartial:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              conformant:
                description: |-
                  Conformant reports whether no control is left open. It is deliberately
                  strict: partial technical coverage without attestation counts as open.
                type: boolean
              controls:
                description: Controls holds the per-control results.
                items:
                  description: |-
                    ControlResult is the assessment of one framework control for one model
                    version.
                  properties:
                    attestedBy:
                      description: AttestedBy names who closed the control, when an
                        attestation applied.
                      type: string
                    automation:
                      description: |-
                        Automation records how much of this control Zeus can evidence at all:
                        Full, Partial, or None. A control marked None is never satisfied by a
                        scan — only by an attestation.
                      enum:
                      - Full
                      - Partial
                      - None
                      type: string
                    controlID:
                      description: ControlID is the framework subcategory, e.g. "MEASURE
                        2.7".
                      type: string
                    evidence:
                      description: Evidence lists the Zeus signals observed for this
                        control.
                      items:
                        type: string
                      type: array
                    function:
                      description: Function is the AI RMF core function the control
                        belongs to.
                      type: string
                    reason:
                      description: Reason explains the status in terms an auditor
                        can follow.
                      type: string
                    status:
                      description: Status of the control.
                      enum:
                      - Satisfied
                      - PartiallySatisfied
                      - NotSatisfied
                      - Attested
                      - AttestationRequired
                      - NotApplicable
                      type: string
                    warning:
                      description: |-
                        Warning surfaces something an auditor should examine even when the
                        control is not open.
                      type: string
                  required:
                  - controlID
                  - status
                  type: object
                type: array
              message:
                type: string
              openControlCount:
                format: int32
                type: integer
              summary:
                items:
                  description: FunctionSummary counts control outcomes within one
                    core function.
                  properties:
                    attested:
                      format: int32
                      type: integer
                    awaitingAttestation:
                      format: int32
                      type: integer
                    function:
                      type: string
                    notApplicable:
                      format: int32
                      type: integer
                    notSatisfied:
                      format: int32
                      type: integer
                    partial:
                      format: int32
                      type: integer
                    satisfied:
                      format: int32
                      type: integer
                  required:
                  - function
                  type: object
                type: array
              totalControls:
                format: int32
                type: integer
              unmeasuredCharacteristics:
                description: |-
                  UnmeasuredCharacteristics lists the trustworthiness characteristics
                  this assessment did not evaluate. AI RMF MEASURE 1.1 requires that
                  what cannot be measured is documented, so this is a first-class field
                  rather than a footnote.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
