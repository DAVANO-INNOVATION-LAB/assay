---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: artifactscans.security.davano.io
spec:
  group: security.davano.io
  names:
    kind: ArtifactScan
    listKind: ArtifactScanList
    plural: artifactscans
    singular: artifactscan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .spec.modelVersion
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .status.riskScore
      name: Risk
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ArtifactScan is a request to scan one model artifact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ArtifactScanSpec describes one scan of one model artifact.
            properties:
              artifact:
                description: Artifact is the artifact to scan.
                properties:
                  digest:
                    description: Digest is the content digest of the artifact, when
                      known.
                    type: string
                  format:
                    description: |-
                      Format is the model format reported by the registry
                      (e.g. safetensors, onnx, pickle, gguf).
                    type: string
                  mediaType:
                    description: MediaType of the artifact, when known.
                    type: string
                  sizeBytes:
                    description: SizeBytes is the artifact size, when known.
                    format: int64
                    type: integer
                  uri:
                    description: |-
                      URI of the artifact. Supported schemes: s3://bucket/path,
                      oci://registry/repo:tag, pvc://claim-name/path,
                      modelcar://registry/repo@sha256:..., https://...
                    type: string
                required:
                - uri
                type: object
              connectorRef:
                description: ConnectorRef names the ModelRegistryConnector that created
                  this scan.
                type: string
              modelName:
                description: ModelName is the registered model name in the Model Registry.
                type: string
              modelVersion:
                description: ModelVersion is the model version name.
                type: string
              policyRef:
                description: PolicyRef names the ArtifactScanPolicy governing this
                  scan.
                type: string
              registryModelID:
                description: RegistryModelID is the registry's internal id for the
                  model.
                type: string
              registryVersionID:
                description: RegistryVersionID is the registry's internal id for the
                  version.
                type: string
              scanners:
                description: Scanners overrides the policy's scanner set when non-empty.
                items:
                  type: string
                type: array
              trigger:
                description: "Trigger records why this scan exists. Without it every
                  scan looks the\nsame afterwards, and \"was this model checked when
                  it was registered, or\nonly when someone tried to deploy it, or
                  has it been rechecked since\"\nbecomes unanswerable — which is most
                  of what an auditor asks.\n\n\tRegistry  a model source published
                  a version\n\tRuntime   a workload tried to deploy it\n\tPeriodic
                  \ a scheduled recheck, e.g. after a CVE database refresh\n\tManual
                  \   a person asked for it\n\tPipeline  CI asked for it"
                enum:
                - Registry
                - Runtime
                - Periodic
                - Manual
                - Pipeline
                type: string
              triggeredBy:
                description: |-
                  TriggeredBy identifies what caused it: a connector name, a workload, or
                  a username. Paired with Trigger it answers "who asked, and why".
                type: string
            required:
            - artifact
            type: object
          status:
            description: ArtifactScanStatus tracks scan execution and outcome.
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                type: string
              phase:
                enum:
                - Pending
                - Fetching
                - Scanning
                - Completed
                - Failed
                type: string
              results:
                items:
                  description: ScannerResult is the per-scanner outcome of a scan.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    drift:
                      description: |-
                        Drift counts the subset of findings reporting that the artifact's own
                        declarations disagree with its bytes — a config naming a precision the
                        tensors do not carry, an index claiming shards that are not there.

                        It is a separate count rather than a severity bucket because drift is
                        gated separately: it is frequently benign (a quantized re-upload
                        carrying its original config is the common case) and occasionally the
                        only sign that an artifact is not what it claims to be. Folding it into
                        Severities would make those two indistinguishable.
                      properties:
                        critical:
                          format: int32
                          type: integer
                        high:
                          format: int32
                          type: integer
                        low:
                          format: int32
                          type: integer
                        medium:
                          format: int32
                          type: integer
                        unknown:
                          format: int32
                          type: integer
                      type: object
                    findings:
                      description: Findings is the total number of findings the scanner
                        reported.
                      format: int32
                      type: integer
                    message:
                      type: string
                    produced:
                      description: |-
                        Produced reports whether a scanner whose job is to emit a document
                        actually emitted one. Nil means the question does not apply.

                        A bill-of-materials scanner that runs over an artifact it cannot
                        describe finds nothing and exits zero, which is byte-for-byte the same
                        result as one that described a clean model. Without this field a policy
                        requiring a bill of materials is satisfied by a scanner that produced
                        none — the gate would read as enforced and enforce nothing.
                      type: boolean
                    reportRef:
                      description: ReportRef names the ArtifactScanReport holding
                        detailed findings.
                      type: string
                    scanner:
                      description: Scanner is the scanner name (e.g. clamav, trivy,
                        model-inspector).
                      type: string
                    severities:
                      description: SeverityCounts summarizes findings by severity.
                      properties:
                        critical:
                          format: int32
                          type: integer
                        high:
                          format: int32
                          type: integer
                        low:
                          format: int32
                          type: integer
                        medium:
                          format: int32
                          type: integer
                        unknown:
                          format: int32
                          type: integer
                      type: object
                    status:
                      enum:
                      - Pending
                      - Running
                      - Passed
                      - Failed
                      - Error
                      - Skipped
                      type: string
                  required:
                  - scanner
                  - status
                  type: object
                type: array
              riskScore:
                description: RiskScore is 0 (clean) to 100 (critical risk).
                format: int32
                type: integer
              scannedDigest:
                description: |-
                  ScannedDigest is the content digest the fetch step measured on the bytes
                  it actually staged. It is the identity a verdict belongs to: the
                  admission gate compares it against the digest a workload is deploying,
                  so an approval cannot be replayed onto different bytes at the same URI.
                type: string
              startTime:
                format: date-time
                type: string
              verdict:
                enum:
                - Approved
                - Quarantined
                - ReviewRequired
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
