---
# Connects Assay to the OpenShift AI Model Registry. Every model version the
# registry knows about gets an ArtifactScan, and the verdict is written back
# as custom properties so it shows up in the registry UI.
apiVersion: security.davano.io/v1alpha1
kind: ModelRegistryConnector
metadata:
  name: rhoai-registry
  namespace: assay-system
spec:
  registryURL: https://modelregistry-sample.rhoai-model-registries.svc.cluster.local:8080
  authSecretRef:
    name: model-registry-token
    key: token
  pollInterval: 60s
  policyRef: production-baseline
  writeBack: true
---
apiVersion: v1
kind: Secret
metadata:
  name: model-registry-token
  namespace: assay-system
type: Opaque
stringData:
  # Replace with a token for a service account that can read the registry and
  # patch model version properties.
  token: REPLACE_ME
