# The namespace itself is in config/namespace.yaml so it can be applied first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assay-controller-manager
  namespace: assay-system
  labels:
    app.kubernetes.io/name: assay-model-scanner
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: assay-model-scanner
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assay-model-scanner
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: assay-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: quay.io/davano/assay-operator:0.1.0
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --scan-service-account=assay-scanner
            # Point this at a mirror for a disconnected cluster; the scanner
            # images carry their own vulnerability and signature databases, so
            # scans themselves need no egress.
            - --scanner-registry=quay.io/davano
            # Phase 1 default: report on models with no scan rather than
            # blocking them, so installing Assay cannot break existing
            # deployments. Flip to true once coverage is complete.
            - --require-report=false
          env:
            # The scan Jobs run this same image for their fetch and publish
            # steps, so the manager must know its own image reference.
            - name: ASSAY_OPERATOR_IMAGE
              value: quay.io/davano/assay-operator:0.1.0
            # Scans and their reports live here, while the workloads the gate
            # validates live in the teams' own namespaces. The gate needs to
            # know where to look or it finds nothing and admits everything.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            # Populated by the OpenShift service CA operator via the
            # service.beta.openshift.io/serving-cert-secret-name annotation.
            secretName: assay-webhook-server-cert
      terminationGracePeriodSeconds: 10
