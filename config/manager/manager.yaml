# The namespace itself is in config/namespace.yaml so it can be applied first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assay-controller-manager
  namespace: assay-system
  labels:
    app.kubernetes.io/name: assay-model-scanner
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Both replicas serve the admission webhook, so one must stay up
      # throughout a rollout: with failurePolicy Ignore, a gap in endpoints is
      # a gap in enforcement, not an outage anyone would notice.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assay-model-scanner
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assay-model-scanner
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: assay-controller-manager
      # An admission webhook that gets preempted takes model deployment with
      # it, since the gate then fails open.
      priorityClassName: system-cluster-critical
      # Endpoint removal is asynchronous with SIGTERM: without a short drain,
      # AdmissionReviews already in flight hit a closing listener.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # Two replicas on one node is one drain away from no gate at all.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: assay-model-scanner
                    app.kubernetes.io/component: controller
      containers:
        - name: manager
          image: docker.io/davanolab/assay-operator:0.1.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --scan-service-account=assay-scanner
            # Point this at a mirror for a disconnected cluster; the scanner
            # images carry their own vulnerability and signature databases, so
            # scans themselves need no egress.
            - --scanner-registry=docker.io/davanolab
            # Phase 1 default: report on models with no scan rather than
            # blocking them, so installing Assay cannot break existing
            # deployments. Flip to true once coverage is complete.
            - --require-report=false
          env:
            # The scan Jobs run this same image for their fetch and publish
            # steps, so the manager must know its own image reference.
            - name: ASSAY_OPERATOR_IMAGE
              value: docker.io/davanolab/assay-operator:0.1.0
            # Scans and their reports live here, while the workloads the gate
            # validates live in the teams' own namespaces. The gate needs to
            # know where to look or it finds nothing and admits everything.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          # Cache sync on a large cluster can take longer than the liveness
          # probe's patience; a startup probe gives it room without also
          # slowing down restart detection once running.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          # /readyz reports the webhook's TLS listener, so the pod joins the
          # Service only once it can actually answer an AdmissionReview.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            # Populated by the OpenShift service CA operator via the
            # service.beta.openshift.io/serving-cert-secret-name annotation.
            secretName: assay-webhook-server-cert
