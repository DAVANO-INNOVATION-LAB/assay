---
apiVersion: v1
kind: Namespace
metadata:
  name: zeus-system
  labels:
    app.kubernetes.io/name: zeus-model-scanner
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus-controller-manager
  namespace: zeus-system
  labels:
    app.kubernetes.io/name: zeus-model-scanner
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zeus-model-scanner
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeus-model-scanner
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: zeus-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: quay.io/zeus-security/zeus-operator:0.1.0
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --scan-service-account=zeus-scanner
            # Point this at a mirror for a disconnected cluster; the scanner
            # images carry their own vulnerability and signature databases, so
            # scans themselves need no egress.
            - --scanner-registry=quay.io/zeus-security
            # Phase 1 default: report on models with no scan rather than
            # blocking them, so installing Zeus cannot break existing
            # deployments. Flip to true once coverage is complete.
            - --require-report=false
          env:
            # The scan Jobs run this same image for their fetch and publish
            # steps, so the manager must know its own image reference.
            - name: ZEUS_OPERATOR_IMAGE
              value: quay.io/zeus-security/zeus-operator:0.1.0
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            # Populated by the OpenShift service CA operator via the
            # service.beta.openshift.io/serving-cert-secret-name annotation.
            secretName: zeus-webhook-server-cert
      terminationGracePeriodSeconds: 10
