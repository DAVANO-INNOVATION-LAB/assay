---
apiVersion: v1
kind: Service
metadata:
  name: zeus-webhook-service
  namespace: zeus-system
  annotations:
    # OpenShift's service CA operator issues and rotates the serving cert.
    # This avoids shipping cert-manager as a hard dependency.
    service.beta.openshift.io/serving-cert-secret-name: zeus-webhook-server-cert
spec:
  selector:
    app.kubernetes.io/name: zeus-model-scanner
    app.kubernetes.io/component: controller
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      name: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: zeus-model-deployment-gate
  annotations:
    # Injects the service CA bundle so the API server trusts the webhook.
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: models.security.zeus.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore keeps a Zeus outage from blocking all model deployments. Switch
    # to Fail once the operator is proven stable in the cluster, since Ignore
    # means an attacker who can disrupt Zeus can also bypass the gate.
    failurePolicy: Ignore
    timeoutSeconds: 10
    clientConfig:
      service:
        name: zeus-webhook-service
        namespace: zeus-system
        path: /validate-model-deployment
        port: 443
    namespaceSelector:
      # Only namespaces that opt in are gated, and Zeus never gates itself or
      # the control plane.
      matchExpressions:
        - key: security.zeus.io/enforce
          operator: In
          values: ["true"]
    rules:
      - apiGroups: ["serving.kserve.io"]
        apiVersions: ["v1beta1", "v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["inferenceservices"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
