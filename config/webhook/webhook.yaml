---
apiVersion: v1
kind: Service
metadata:
  name: assay-webhook-service
  namespace: assay-system
  annotations:
    # OpenShift's service CA operator issues and rotates the serving cert.
    # This avoids shipping cert-manager as a hard dependency.
    service.beta.openshift.io/serving-cert-secret-name: assay-webhook-server-cert
spec:
  selector:
    app.kubernetes.io/name: assay-model-scanner
    app.kubernetes.io/component: controller
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      name: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: assay-model-deployment-gate
  annotations:
    # Injects the service CA bundle so the API server trusts the webhook.
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: models.security.davano.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore keeps a Assay outage from blocking all model deployments. Switch
    # to Fail once the operator is proven stable in the cluster, since Ignore
    # means an attacker who can disrupt Assay can also bypass the gate.
    failurePolicy: Ignore
    timeoutSeconds: 10
    clientConfig:
      service:
        name: assay-webhook-service
        namespace: assay-system
        path: /validate-model-deployment
        port: 443
    namespaceSelector:
      # Only namespaces that opt in are gated, and Assay never gates itself or
      # the control plane.
      matchExpressions:
        - key: security.davano.io/enforce
          operator: In
          values: ["true"]
    rules:
      - apiGroups: ["serving.kserve.io"]
        apiVersions: ["v1beta1", "v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["inferenceservices"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
---
# Signs risk acceptances. An ArtifactException is the one place a human
# overrides the scanner, so it is the record that has to survive an argument
# later: who accepted this, when, on what grounds. The webhook takes the
# identity from the authenticated request and overwrites whatever the object
# claimed, because a name a user can type is not a signature.
#
# failurePolicy is Fail, unlike the deployment gate: if the signer is down the
# correct outcome is that no waiver is recorded, not that unsigned ones are.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: assay-exception-signer
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: exceptions.security.davano.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: assay-webhook-service
        namespace: assay-system
        path: /sign-exception
        port: 443
    rules:
      - apiGroups: ["security.davano.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["artifactexceptions"]
        scope: Namespaced
