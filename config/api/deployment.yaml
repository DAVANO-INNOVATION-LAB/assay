apiVersion: apps/v1
kind: Deployment
metadata:
  name: assay-api
  namespace: assay-system
  labels:
    app.kubernetes.io/name: assay-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: assay-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assay-api
    spec:
      serviceAccountName: assay-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # The same image as the operator. It carries four binaries and the
          # entrypoint selects one, so an air-gapped cluster mirrors a single
          # artifact rather than keeping two in step.
          image: ghcr.io/davano-innovation-lab/assay-operator:0.1.0
          command: ["/assay-api"]
          args:
            - --listen=:8443
            - --bindings=/config/bindings.yaml
            - --session-key-file=/session/key
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ASSAY_OIDC_ISSUER
              valueFrom:
                secretKeyRef: { name: assay-oidc, key: issuer }
            - name: ASSAY_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: assay-oidc, key: clientID }
            # Passed by environment rather than argument so it does not appear
            # in the process list or in `kubectl describe pod`.
            - name: ASSAY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: assay-oidc, key: clientSecret }
            - name: ASSAY_OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef: { name: assay-oidc, key: redirectURL }
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            initialDelaySeconds: 3
          volumeMounts:
            - { name: bindings, mountPath: /config, readOnly: true }
            - { name: session, mountPath: /session, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: bindings
          configMap:
            name: assay-bindings
        # Shared across replicas and stable across restarts, so a rollout does
        # not sign everybody out.
        - name: session
          secret:
            secretName: assay-session-key
        - name: tls
          secret:
            secretName: assay-api-tls
---
apiVersion: v1
kind: Service
metadata:
  name: assay-api
  namespace: assay-system
spec:
  selector:
    app.kubernetes.io/name: assay-api
  ports:
    - name: https
      port: 443
      targetPort: https
