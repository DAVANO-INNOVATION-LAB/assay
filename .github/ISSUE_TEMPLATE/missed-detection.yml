name: Missed detection
description: Assay approved something it should have flagged
labels: ["detection", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Stop if this is exploitable.** A general technique for getting
        malicious artifacts past the gate is a security report — see
        [SECURITY.md](https://github.com/DAVANO-INNOVATION-LAB/assay/blob/main/SECURITY.md).
        This template is for a specific artifact that was judged wrongly.

        Please check the documented limits first. Weight-level poisoning,
        training-data poisoning, runtime evasion and registry rug pulls are out
        of scope by construction — a scanner that inspects an artifact cannot
        see them.
  - type: textarea
    id: artifact
    attributes:
      label: The artifact
      description: >-
        Format, roughly what it contains, and where it came from. A public URL
        or a minimal reproducer is ideal. Do not attach live malware.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should have been detected, and why
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: What Assay reported
      description: The verdict, risk score, and findings. `assay inspect <path>` output is perfect.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or image digest
    validations: { required: true }
