name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        run: make cli-release VERSION=${{ steps.version.outputs.version }}

      # Checksums are the minimum provenance for a security tool's own
      # binaries: a scanner nobody can verify is a scanner nobody should trust.
      - name: Checksums
        working-directory: dist
        run: sha256sum assay-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: assay-cli
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/assay-*
            dist/SHA256SUMS
          generate_release_notes: true

  image:
    name: Operator image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}/assay-operator:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/assay-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
