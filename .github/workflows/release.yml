name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        run: make cli-release VERSION=${{ steps.version.outputs.version }}

      # Checksums are the minimum provenance for a security tool's own
      # binaries: a scanner nobody can verify is a scanner nobody should trust.
      - name: Checksums
        working-directory: dist
        run: sha256sum assay-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: assay-cli
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/assay-*
            dist/SHA256SUMS
          generate_release_notes: true

  image:
    name: Operator image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Docker Hub needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository
      # secrets (Settings > Secrets and variables > Actions). The token is an
      # access token from hub.docker.com/settings/security, not the password.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ vars.IMAGE_NAMESPACE || 'docker.io/davanolab' }}/assay-operator:${{ steps.version.outputs.version }}
            ${{ vars.IMAGE_NAMESPACE || 'docker.io/davanolab' }}/assay-operator:latest
          # A supply-chain tool should ship its own provenance and SBOM.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scanners:
    name: Scanner images
    runs-on: ubuntu-latest
    # The operator image alone is not a working install: every default scan
    # needs these, and they carry baked vulnerability and signature databases
    # so a scan needs no egress.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build scanner images
        run: |
          make scanners \
            REGISTRY="${{ vars.IMAGE_NAMESPACE || 'docker.io/davanolab' }}" \
            IMAGE_TAG="${{ steps.version.outputs.version }}"

      - name: Verify they detect what they claim to
        # Pushing a scanner that silently finds nothing is worse than not
        # shipping one, so the air-gapped smoke test gates the push.
        run: |
          make scanners-smoke \
            REGISTRY="${{ vars.IMAGE_NAMESPACE || 'docker.io/davanolab' }}" \
            IMAGE_TAG="${{ steps.version.outputs.version }}"

      - name: Push scanner images
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make scanners-push \
            REGISTRY="${{ vars.IMAGE_NAMESPACE || 'docker.io/davanolab' }}" \
            IMAGE_TAG="${{ steps.version.outputs.version }}"
