name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; a stale PR build helps nobody.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify generated code is current
        run: |
          make generate manifests
          git diff --exit-code api/ config/crd/ config/rbac/

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go vet -tags mlflow_live ./internal/modelsource/

      - name: Test
        run: go test ./... -race -coverprofile=cover.out

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # `make lint` rather than golangci-lint-action: the action downloads a
      # prebuilt binary, and golangci-lint refuses to run when the Go version
      # it was built with is older than the one go.mod targets. Installing it
      # with `go install` builds it against this job's toolchain, so the
      # version constraint is satisfied by construction — and CI then runs
      # exactly the command a developer runs locally, from one pinned version
      # in the Makefile instead of two that can drift.
      - name: Lint
        run: make lint

  mlflow-live:
    name: MLflow integration (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The runner has Docker, so the MLflow source is exercised against a real
      # tracking server rather than a mock: register a malicious pickle, scan
      # it, assert Quarantined and the verdict tag written back.
      - name: Live MLflow scan
        run: make test-mlflow

  cli-smoke:
    name: CLI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: make cli

      # The exit codes are the CLI's contract with CI systems, so assert them
      # against real artifacts rather than trusting the unit tests alone.
      - name: Malicious pickle is Quarantined (exit 3)
        run: |
          mkdir -p /tmp/evil
          python3 -c "
          import pickle, os
          class E:
              def __reduce__(self): return (os.system, ('echo pwned',))
          pickle.dump(E(), open('/tmp/evil/weights.pkl','wb'))
          "
          set +e
          ./bin/assay inspect /tmp/evil
          code=$?
          set -e
          test "$code" = "3" || { echo "expected exit 3, got $code"; exit 1; }

      - name: Clean artifact is Approved (exit 0)
        run: |
          mkdir -p /tmp/clean
          python3 -c "
          import json, struct
          h = json.dumps({'__metadata__': {'format': 'pt'}}).encode()
          open('/tmp/clean/model.safetensors','wb').write(struct.pack('<Q', len(h)) + h)
          "
          ./bin/assay inspect /tmp/clean

      - name: JSON output is parseable and carries a verdict
        run: |
          ./bin/assay inspect --json /tmp/evil > /tmp/report.json || true
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/report.json'))
          assert r['verdict'] == 'Quarantined', r['verdict']
          assert r['riskScore'] > 0, r['riskScore']
          assert r['findings'], 'no findings'
          print('verdict', r['verdict'], 'risk', r['riskScore'])
          "

  packaging:
    name: Helm and Kustomize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5

      # The chart's CRDs and ClusterRole rules are copied from config/ by
      # `make helm-sync`. If someone edits a kubebuilder marker and forgets to
      # re-sync, the chart ships stale RBAC — which fails at runtime as a
      # permission error rather than at build time.
      - name: Chart is in sync with generated manifests
        run: |
          make helm-sync
          git diff --exit-code deploy/helm/assay/crds deploy/helm/assay/rbac-rules.yaml

      - name: Lint and render the chart in every cert mode
        run: make helm-lint

      - name: Kustomize base and overlays build
        run: make kustomize-build

      # Rendering only proves the templates produce YAML. This checks the YAML
      # is actually valid against the Kubernetes schemas — a misspelled field
      # or a string where an int belongs renders fine and fails on apply.
      #
      # kubeconform rather than `kubectl apply --dry-run=client`: kubectl
      # downloads the OpenAPI schema from a live cluster, which a runner has
      # no access to, so it fails on connection refused rather than on
      # anything about the manifests.
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Manifests validate against the Kubernetes schemas
        run: |
          # ServiceMonitor/PrometheusRule/Certificate are CRDs from operators
          # that may not be installed; their absence is not an error here.
          validate() {
            kubeconform -strict -summary -ignore-missing-schemas \
              -kubernetes-version 1.29.0 -
          }
          echo "== helm: openshift cert mode"
          helm template assay deploy/helm/assay --namespace assay-system | validate
          echo "== helm: cert-manager, monitoring, extra scan namespaces"
          helm template assay deploy/helm/assay --namespace assay-system \
            --set webhook.certMode=cert-manager \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set scanner.additionalNamespaces='{team-a}' | validate
          for o in config/default config/overlays/dev config/overlays/enforcing; do
            echo "== kustomize: $o"
            kubectl kustomize "$o" | validate
          done

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
