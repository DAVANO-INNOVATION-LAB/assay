apiVersion: v2
name: assay
description: Supply-chain security for AI model artifacts — scans registered models and gates unapproved ones at deployment.
type: application

# version is the chart version; appVersion is the Assay release it deploys.
# Both are rewritten by `make helm-package VERSION=vX.Y.Z`.
version: 0.1.0
appVersion: "0.1.0"

home: https://github.com/DAVANO-INNOVATION-LAB/assay
sources:
  - https://github.com/DAVANO-INNOVATION-LAB/assay
keywords:
  - security
  - supply-chain
  - machine-learning
  - openshift-ai
  - kserve
maintainers:
  - name: Davano Innovation Lab
annotations:
  # The chart installs CRDs from crds/, which Helm creates on install but
  # never upgrades or deletes. Upgrading them is a deliberate, separate step.
  "helm.sh/resource-policy-note": "CRDs are install-only; see NOTES.txt"
