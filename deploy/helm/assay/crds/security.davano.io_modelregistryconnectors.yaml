  names:
    kind: ModelRegistryConnector
    listKind: ModelRegistryConnectorList
    plural: modelregistryconnectors
    shortNames:
    - mrc
    singular: modelregistryconnector
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.registryURL
      name: Registry
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.registeredModels
      name: Models
      type: integer
    - jsonPath: .status.scansCreated
      name: Scans
      type: integer
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelRegistryConnector connects Assay to an OpenShift AI Model
          Registry.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelRegistryConnectorSpec defines a connection to an OpenShift AI
              (Kubeflow) Model Registry instance to watch for models to scan.
            properties:
              authSecretRef:
                description: |-
                  AuthSecretRef references a Secret containing a bearer token used to
                  authenticate against the registry.
                properties:
                  key:
                    default: token
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              includeModels:
                description: |-
                  IncludeModels restricts scanning to registered models whose name
                  matches one of these globs. Empty means all models.
                items:
                  type: string
                type: array
              insecureSkipTLSVerify:
                description: InsecureSkipTLSVerify disables TLS certificate verification.
                type: boolean
              policyRef:
                description: |-
                  PolicyRef names the ArtifactScanPolicy applied to scans created by
                  this connector. Empty selects the built-in default scanner set.
                type: string
              pollInterval:
                description: |-
                  PollInterval controls how often the registry is polled for new
                  models and versions. Defaults to 1m.
                type: string
              registryURL:
                description: |-
                  RegistryURL is the base URL of the Model Registry REST API,
                  e.g. https://model-registry.rhoai-model-registries.svc:8080
                type: string
              writeBack:
                description: |-
                  WriteBack controls whether scan summaries are written back into the
                  Model Registry as custom properties. Defaults to true.
                type: boolean
            required:
            - registryURL
            type: object
          status:
            description: ModelRegistryConnectorStatus reports sync progress.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
