    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ArtifactScanPolicy configures scanning and gating for model artifacts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ArtifactScanPolicySpec defines scanners to run and rules
              to enforce.
            properties:
              enforcement:
                default: Enforce
                description: |-
                  Enforcement controls admission behavior for artifacts failing this
                  policy: Enforce rejects, Warn admits with a warning, Audit only logs.
                enum:
                - Enforce
                - Warn
                - Audit
                type: string
              rules:
                description: PolicyRules are the pass/fail gates evaluated after scanning.
                properties:
                  allowedFormats:
                    description: AllowedFormats restricts model formats (e.g. safetensors,
                      onnx, gguf).
                    items:
                      type: string
                    type: array
                  blockMalware:
                    description: BlockMalware quarantines on any malware finding.
                      Defaults to true.
                    type: boolean
                  blockSecrets:
                    description: BlockSecrets quarantines on any leaked-secret finding.
                      Defaults to true.
                    type: boolean
                  blockUnsafeModel:
                    description: |-
                      BlockUnsafeModel quarantines on a critical model-inspection finding —
                      a pickle that imports os.system, an archive that escapes its directory,
                      trust_remote_code. These execute on load, so they are as serious as
                      malware. Defaults to true.
                    type: boolean
                  blockedFormats:
                    description: BlockedFormats quarantines specific formats (e.g.
                      pickle).
                    items:
                      type: string
                    type: array
                  maxCriticalCVEs:
                    description: MaxCriticalCVEs above which the artifact is quarantined.
                      Nil = no limit.
                    format: int32
                    type: integer
                  maxHighCVEs:
                    format: int32
                    type: integer
                  requireProvenance:
                    description: RequireProvenance demands verified provenance attestations.
                    type: boolean
                  requireSBOM:
                    description: RequireSBOM demands a generated SBOM before approval.
                    type: boolean
                  requireSignature:
                    description: RequireSignature demands a verified Cosign signature
                      from a TrustedPublisher.
                    type: boolean
                type: object
              scanners:
                items:
                  description: ScannerSpec configures one scanner in a policy.
                  properties:
                    args:
                      description: Args overrides the scanner container arguments.
                      items:
                        type: string
                      type: array
                    enabled:
                      type: boolean
                    image:
                      description: Image overrides the built-in image for this scanner.
                      type: string
                    name:
                      description: Name of the scanner (clamav, model-inspector, trivy,
                        syft, trufflehog, ...).
                      type: string
                    resources:
                      description: ResourceRequirements describes the compute resource
                        requirements.
                      properties:
