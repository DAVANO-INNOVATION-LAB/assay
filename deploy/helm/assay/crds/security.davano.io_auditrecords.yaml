    controller-gen.kubebuilder.io/version: v0.17.2
  name: auditrecords.security.davano.io
spec:
  group: security.davano.io
  names:
    kind: AuditRecord
    listKind: AuditRecordList
    plural: auditrecords
    singular: auditrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.seq
      name: Seq
      type: integer
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.subject
      name: Subject
      type: string
    - jsonPath: .spec.actor
      name: Actor
      type: string
    - jsonPath: .spec.time
      name: Time
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuditRecord is an immutable entry in the security decision log.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuditRecordSpec is one link in the tamper-evident decision log.

              Every field is part of the hash preimage. There is deliberately no status
              subresource carrying anything hashed: a record is written once and never
              updated, and RBAC should grant create without update or delete. The chain
              makes edits evident even to someone who bypasses that.
            properties:
              actor:
                description: Actor is the authenticated identity responsible, or "system".
                type: string
              detail:
                additionalProperties:
                  type: string
                description: Detail carries event-specific fields.
                type: object
              hash:
                description: Hash commits to every field above.
                type: string
              prevHash:
                description: PrevHash links to the preceding record.
                type: string
              seq:
                description: Seq is the position in the chain, starting at 1.
                format: int64
                type: integer
              subject:
                description: Subject the event concerns, as "model/version".
                type: string
              time:
                description: Time the event was recorded, in UTC to second precision.
                format: date-time
                type: string
              type:
                description: Type of event (RiskAccepted, VerdictIssued, DeploymentBlocked,
                  ...).
                type: string
            required:
            - actor
            - hash
            - prevHash
            - seq
            - subject
            - time
            - type
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
