[build]
  # Static site: nothing to compile, just publish the directory.
  publish = "web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # The page is fully self-contained — no external scripts, styles, fonts,
    # images, or network calls — so the policy can be strict enough to make
    # that a guarantee rather than a convention.
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
